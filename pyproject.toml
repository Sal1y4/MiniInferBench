[project]
name = "miniinferbench"
version = "0.1.0.dev0"
description = "A small, reproducible benchmark harness for LLM inference on a single GPU."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Sal1y4" }]
dependencies = [
    "torch>=2.7",
    "transformers>=4.50",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
mib = "miniinferbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/miniinferbench"]

# uv installs torch from the CUDA 12.8 index. cu128 wheels cover both
# sm_86 (RTX 3060) and sm_120 (RTX 5070). Plain pip ignores this section,
# which lets CI install the CPU wheel instead.
[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["transformers.*", "matplotlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs a CUDA device (skipped automatically when none is available)"]
